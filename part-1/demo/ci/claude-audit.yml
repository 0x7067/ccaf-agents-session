# ─────────────────────────────────────────────────────────────────────────────
# Claude multi-agent audit, drop this into przsend/.github/workflows/
#
# przsend already has ci.yml (lint + typecheck). This adds ONE more job to the
# same pipeline: the exact audit the class watched live, with nobody at the
# keyboard. Requires an ANTHROPIC_API_KEY repository secret.
#
# CCAF notes:
#  · `claude -p` is the only correct way to run Claude in CI (non-interactive).
#  · The review runs in a FRESH session, never the one that wrote the code.
#  · On re-reviews, feed prior findings back in and ask only for new/unresolved
#    issues, so the bot doesn't repeat comments (see the re-review step below).
# ─────────────────────────────────────────────────────────────────────────────
name: Claude audit

on:
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # to post the summary as a PR comment
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run the audit agent (headless)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude -p "Audit this repository. You are the coordinator: do not read
          project files yourself. Spawn the a11y-auditor, copy-auditor and
          code-auditor subagents IN PARALLEL, giving each the context it needs
          (Next.js temporary-file-sharing app, next-intl, Prisma). Merge their
          findings into the structured output." \
            --agents "$(cat .github/claude/auditors.json)" \
            --allowed-tools "Agent" "Task" "Read" "Grep" "Glob" \
            --output-format json \
            --json-schema "$(cat .github/claude/audit-schema.json)" \
            > audit.json

      - name: Publish job summary
        run: |
          {
            echo "## 🤖 Claude audit"
            jq -r '.structured_output.summary // "No summary produced."' audit.json
            echo
            jq -r '.structured_output.findings[]?
                   | "- **[\(.severity)]** \(.dimension) · `\(.file)` | \(.issue)"' audit.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload full result
        uses: actions/upload-artifact@v4
        with:
          name: claude-audit
          path: audit.json

      # Optional next step for the class to build themselves:
      # parse audit.json and post inline PR comments via the GitHub API.
      # On re-runs, download the previous audit artifact and include it in the
      # prompt: "Here are the previous findings: … Report only NEW or
      # UNRESOLVED issues." → no duplicate comments.
